# Scenario probe: does a job that declares the publication Environment with deployment disabled still receive the
# Environment secrets and still obey the Environment's deployment branch policy? Prints only whether each secret is empty.
name: scenario-deployment-probe
run-name: scenario-deployment-probe ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Unique marker that lets the dispatching script find this run
        required: true
        type: string

permissions: {}

jobs:
  nodeploy:
    name: nodeploy
    if: ${{ github.event.sender.id == 2095171 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: steward-publication
      deployment: false
    permissions: {}
    steps:
      - name: Report whether the secrets are empty
        env:
          PATCH_STEWARD_APP_ID: ${{ secrets.PATCH_STEWARD_APP_ID }}
          PATCH_STEWARD_APP_PRIVATE_KEY: ${{ secrets.PATCH_STEWARD_APP_PRIVATE_KEY }}
        run: |
          if [ "${#PATCH_STEWARD_APP_ID}" -eq 0 ]; then id_empty=true; else id_empty=false; fi
          if [ "${#PATCH_STEWARD_APP_PRIVATE_KEY}" -eq 0 ]; then key_empty=true; else key_empty=false; fi
          echo "PATCH_STEWARD_APP_ID length-zero=$id_empty"
          echo "PATCH_STEWARD_APP_PRIVATE_KEY length-zero=$key_empty"
